name: riverpod_starter
description: Boilerplate Template of Flutter Riverpod.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.11.0
  flutter: ">=3.41.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  go_router: ^17.5.0
  cupertino_icons: ^1.0.5
  flutter_svg: ^2.3.0
  dio: ^5.11.1
  shared_preferences: ^2.0.15
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  cached_network_image: ^3.2.1
  animations: ^2.0.3
  logger: ^2.8.0
  pretty_dio_logger: ^1.1.1
  font_awesome_flutter: ^11.0.0
  fluttertoast: ^9.1.0
  alarm: ^5.15.0
  permission_handler: ^13.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  change_app_package_name: ^1.1.0
  flutter_launcher_icons: ^0.14.4

flutter_icons:
  android: "ic_launcher"
  ios: true
  image_path: "images/launcher_icon.png"

flutter:
  generate: true
  uses-material-design: true
  assets:
    - images/
  fonts:
    - family: Roboto
      fonts:
        - asset: fonts/Roboto-Thin.ttf
          weight: 200
        - asset: fonts/Roboto-Light.ttf
          weight: 200
        - asset: fonts/Roboto-Regular.ttf
          weight: 200
        - asset: fonts/Roboto-Medium.ttf
          weight: 300
        - asset: fonts/Roboto-Bold.ttf
          weight: 600
        - asset: fonts/Roboto-Italic.ttf
          style: italic

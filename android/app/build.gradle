import java.util.regex.Matcher
import java.util.regex.Pattern

plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = loadPropertiesFile('local.properties')
def keystoreProperties = loadPropertiesFile('key.properties')

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

// Short hash of the commit being built, so the diagnostic log can tell
// which build is installed.
def gitCommit() {
    try {
        def out = 'git rev-parse --short HEAD'.execute(null, rootProject.projectDir).text.trim()
        return out ? out : 'unknown'
    } catch (ignored) {
        return 'unknown'
    }
}

def loadPropertiesFile(String fileName) {
    println(fileName)
    def properties = new Properties()
    def propertiesFile = rootProject.file(fileName)
    if (propertiesFile.exists()) {
        propertiesFile.withReader('UTF-8') { reader ->
            properties.load(reader)
        }
    }
    return properties
}

def getCurrentFlavor() {
    Gradle gradle = getGradle()
    String  tskReqStr = gradle.getStartParameter().getTaskRequests().toString()

    Pattern pattern
    println(tskReqStr)
    if( tskReqStr.contains( "assemble" ) )
        pattern = Pattern.compile("assemble(\\w+)(Release|Debug)")
    else if( tskReqStr.contains("bundle") )
        pattern = Pattern.compile("bundle(\\w+)(Release|Debug)")
    else
        pattern = Pattern.compile("generate(\\w+)(Release|Debug)")

    Matcher matcher = pattern.matcher( tskReqStr )

    if( matcher.find() )
        return matcher.group(1).toLowerCase()
    else
    {
        println "NO MATCH FOUND"
        return ""
    }
}

android {
    namespace "com.blz.flutter.riverpod_starter"
    compileSdk flutter.compileSdkVersion
    ndkVersion flutter.ndkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17.toString()
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId "com.blz.flutter.riverpod_starter"
        // Health Connect's client library needs Android 8.
        minSdk Math.max(flutter.minSdkVersion as int, 26)
        targetSdk flutter.targetSdkVersion
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
        buildConfigField "String", "GIT_COMMIT", "\"${gitCommit()}\""
    }

    buildFeatures {
        buildConfig true
    }

    lint {
        checkReleaseBuilds false
    }

    signingConfigs {
        release {
            keyAlias keystoreProperties['keyAlias']
            keyPassword keystoreProperties['password']
            storeFile keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
            storePassword keystoreProperties['password']
        }
    }

    buildTypes {
        release {
            // Fall back to the debug key when key.properties is absent, so
            // local release runs still work; real releases need key.properties.
            signingConfig keystoreProperties['storeFile'] ? signingConfigs.release : signingConfigs.debug
        }
    }

    flavorDimensions "default"
    productFlavors {
        dev {
            resValue "string", "app_name", "早一点点 Dev"
            dimension "default"
            applicationIdSuffix ".dev"
        }
        prod {
            resValue "string", "app_name", "早一点点"
            dimension "default"
        }
    }
}

dependencies {
    // Reads the sleep a band app (Mi Fitness) syncs to Health Connect.
    implementation "androidx.health.connect:connect-client:1.1.0"
    implementation "androidx.activity:activity-ktx:1.9.3"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2"
}

flutter {
    source '../..'
    target "lib/main_" + getCurrentFlavor() + ".dart"
}
